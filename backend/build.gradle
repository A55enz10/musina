plugins {
    id 'java'
    id 'org.springframework.boot' version '4.2.0'
}

group = 'it.musina'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

repositories { mavenCentral() }

dependencyLocking { lockAllConfigurations() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.2.1'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('frontendResources', Sync) {
    dependsOn rootProject.tasks.named('frontendBuild')
    from rootProject.layout.projectDirectory.dir('frontend/dist')
    into layout.buildDirectory.dir('generated/frontend/static')
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/frontend')
tasks.named('processResources') { dependsOn 'frontendResources' }
tasks.named('bootRun') { workingDir rootProject.projectDir }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '768m'
    testLogging { events 'passed', 'skipped', 'failed' }
}
tasks.named('bootJar') { archiveFileName = 'musina.jar' }
