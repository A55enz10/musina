spring.application.name=musina
spring.config.import=optional:file:.env[.properties]
server.address=${MUSINA_BIND_ADDRESS:127.0.0.1}
server.port=${MUSINA_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${MUSINA_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=jdbc:postgresql://127.0.0.1:${MUSINA_DB_PORT:15432}/${MUSINA_DB_NAME:musina_dev}
spring.datasource.username=${MUSINA_DB_USER:musina_dev}
spring.datasource.password=${MUSINA_DB_PASSWORD}
spring.flyway.validate-migration-naming=true
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.enabled=false
logging.level.org.springframework.security=INFO
